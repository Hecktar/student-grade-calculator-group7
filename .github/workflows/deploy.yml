name: Deploy to Render

on:
  # Run only after CI Pipeline completes on main (assessment requirement).
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy after successful CI on main, or when triggered manually.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing repository secret: RENDER_DEPLOY_HOOK_URL"
            echo "See DEPLOYMENT.md for setup instructions."
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Confirm deploy hook trigger
        run: echo "Render deploy hook called successfully."
